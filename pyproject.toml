[project]
name = "enterprise-ai-assistant"
version = "0.1.0"
description = "Agentic RAG assistant for Commercial Bank: LangGraph multi-agent orchestration, RLM research, hybrid retrieval, RBAC."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "httpx>=0.27",
    # Orchestration + LLM providers
    "langgraph>=0.6",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "langchain-google-genai>=2.0",
    "langsmith>=0.3",
    # Retrieval
    "pinecone[asyncio]>=7.0",
    # Shared state (rate limiting, checkpoints, long-term memory)
    "redis>=5.0",
    "langgraph-checkpoint-redis>=0.1",
    # Tools
    "mcp>=1.9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "fakeredis[lua]>=2.26",
]
frontend = [
    "streamlit>=1.38",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["backend", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S105", "S106", "E501"]
"scripts/generate_mock_data.py" = ["E501"]
"backend/mcp_server/data.py" = ["E501"]
"backend/app/auth/users.py" = ["E501"]
